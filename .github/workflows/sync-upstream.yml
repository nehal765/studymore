
name: Sync StudyMore from Salem

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: studymore-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download Salem's latest main
        run: |
          git clone --depth 1 --branch main \
            https://github.com/buildwithsalem/StudyMore.git \
            /tmp/studymore-upstream

      - name: Copy latest application files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-upstream.yml' \
            /tmp/studymore-upstream/ ./

      - name: Check for updates
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run SQLite tests before syncing
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q src

      - name: Commit and push tested changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: update from buildwithsalem/StudyMore main"
          git push origin HEAD:main
